# Tiny Tapeout project information
project:
  title:        "Protocol emulator"      # Project title
  author:       "Mark Stanners"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Three programmable engines that run UART, SPI, I2C and more as firmware, and measure the bus as they go"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_gosforth_protocol_emu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "chip.v"
    - "host_spi.v"
    - "engine.v"
    - "prog_mem.v"
    - "glitch_filter.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CS (host SPI)"
  ui[1]: "SCK (host SPI)"
  ui[2]: "MOSI (host SPI)"
  ui[3]: "engine pin 15 (in)"
  ui[4]: "engine pin 16 (in)"
  ui[5]: "engine pin 17 (in)"
  ui[6]: "engine pin 18 (in)"
  ui[7]: "engine pin 19 (in)"

  # Outputs
  uo[0]: "MISO (host SPI)"
  uo[1]: "IRQ (RX data waiting)"
  uo[2]: "engine pin 8 (out)"
  uo[3]: "engine pin 9 (out)"
  uo[4]: "engine pin 10 (out)"
  uo[5]: "engine pin 11 (out)"
  uo[6]: "engine pin 12 (out)"
  uo[7]: "engine pin 13 (out)"

  # Bidirectional pins
  uio[0]: "engine pin 0 (in/out)"
  uio[1]: "engine pin 1 (in/out)"
  uio[2]: "engine pin 2 (in/out)"
  uio[3]: "engine pin 3 (in/out)"
  uio[4]: "engine pin 4 (in/out)"
  uio[5]: "engine pin 5 (in/out)"
  uio[6]: "engine pin 6 (in/out)"
  uio[7]: "engine pin 7 (in/out)"

# Do not change!
yaml_version: 6
